      <h1>タスクバーのアイコンを左に寄せる</h1>
      <p>Windows 11で、スタートボタンやアプリのアイコンが真ん中にあるのが使いにくければ、<strong>左寄せ</strong>にできます。</p>
      <ol>
      <li><kbd>Win</kbd>＋<kbd>I</kbd> で「設定」を開きます。</li>
      <li>「個人用設定」→「タスク バー」→「タスク バーの動作」を開きます。</li>
      <li>「タスク バーの配置」を「左揃え」にします。戻したいときは、同じ場所で中央揃えを選べばOKです。</li>
      </ol>
      <p><a href="https://support.microsoft.com/ja-jp/windows/experience/personalization/customize-the-taskbar-in-windows">Microsoft公式のタスクバー設定</a>
      </p>
    </article>
